# ============================
# STOCHY — Application Config
# ============================

server.port=8080

# ---- MySQL (XAMPP) ----
spring.datasource.url=jdbc:mysql://localhost:3306/stochy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- JWT ----
stochy.jwt.secret=StochySecretKey2026_ChangeThisInProductionToAtLeast64CharsLong!
stochy.jwt.expiration=86400000

# ---- Mail ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=stochy.app@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Uploads ----
stochy.upload.dir=./uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# ---- CORS ----
stochy.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:8081

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-enums-using-to-string=true

# ---- Groq AI ----
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}

